<!doctype html>
<html class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migennes Subaquatique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
    }
</style>
</head>
<body class="flex flex-col w-full bg-[#d9e4e8]" id="topPage">
    <!-- Main -->
    <main class="w-full flex flex-col gap-10 px-8 pb-5 md:pt-[100px]">
        <!-- Titre principal -->
        <div class="flex flex-col items-center">
            <img class="w-18" src="/images/logos/plongeur-bas.png">
            <p class="text-5xl font-bold text-[#003262]">Adhésion</p>
            <p class="text-gray-500 text-center font-semibold">Rejoignez le club Migennes Subaquatique pour la saison en cours.</p>
        </div>

        <!-- Formulaire Adhésion -->
        <div>
            <form class="flex flex-col items-center gap-5 shadow-xl rounded-xl px-4 py-4 bg-[#f6f6f6]" name="adhesion" netlify>
                <div class="flex items-center gap-2">
                    <img class="w-6 h-5" src="/images/logos/user.png">
                    <p class="font-medium text-2xl">Vos informations</p>
                </div>
                <div class="flex gap-4">
                    <div class="w-full">
                        <label class="font-medium text-gray-500">PRÉNOM *</label>
                        <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="prenom" placeholder="Jacques" required>
                    </div>
                    <div class="w-full">
                        <label class="font-medium text-gray-500">NOM *</label>
                        <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="nom" placeholder="Cousteau" required>
                    </div>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">DATE DE NAISSANCE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="date" name="date_de_naissance" min="1940-01-01" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">EMAIL *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="email" name="email" placeholder="jacques@ocean.fr" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">ADRESSE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="adresse" placeholder="12 Rue Lauzet Ainé, 83110 Sanary-sur-Mer" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">NUMÉRO DE TÉLÉPHONE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="tel" name="numero_de_telephone" placeholder="06 12 34 56 78" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">NUM DE LICENCE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="numero_de_license" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">NIVEAU ACTUEL *</label>
                    <select class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" name="niveau_actuel" required>
                        <option value="debutant">Débutant</option>
                        <option value="bronze">Bronze</option>
                        <option value="argent">Argent</option>
                        <option value="or">Or</option>
                        <option value="niveau_1">Niveau 1</option>
                        <option value="niveau_2">Niveau 2</option>
                        <option value="niveau_3">Niveau 3</option>
                        <option value="pa40">PA40</option>
                        <option value="inititateur">Inititateur</option>
                        <option value="guide_de_palanquee">Guide de palanquée</option>
                        <option value="mf1">MF1</option>
                        <option value="mf2">MF2</option>
                    </select>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">ACTIVITÉS ET FORMATIONS *</label>
                    <div class="w-full overflow-y-scroll h-50">
                        <fieldset id="activites-group">
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="plongee_enfant">
                                <label>Plongée enfant (&lt;12ans)</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="plongee_jeune">
                                <label>Plongée jeune (12-16 ans)</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="plongee_sous_marine">
                                <label>Plongée sous-marine</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="nage_avec_palmes">
                                <label>Nage avec palmes</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="apnee">
                                <label>Apnée</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="ecole_niveau_1">
                                <label>École Niveau 1</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="ecole_niveau_2">
                                <label>École Niveau 2</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="ecole_niveau_3">
                                <label>École Niveau 3</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="rifap">
                                <label>RIFAP</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="initiateur">
                                <label>Initiateur</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="nitrox_base">
                                <label>Nitrox base</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="nitrox_confirme">
                                <label>Nitrox confirmé</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="tiv">
                                <label>TIV</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="vetement_etanche">
                                <label>Vêtement étanche</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="formation_anteor">
                                <label>Formation ANTEOR</label>
                            </div>
                            <div class="flex gap-3 ml-3">
                                <input class="checked:accent-[#FF8B62]" type="checkbox" name="activites_et_formations" value="recyclage_anteor">
                                <label>Recyclage ANTEOR</label>
                            </div>
                        </fieldset>
                        <script>
                            const checkboxes = document.querySelectorAll(
                                'input[name="activites_et_formations"]'
                            );

                            function validateCheckboxes() {
                                const isChecked = [...checkboxes].some(cb => cb.checked);

                                checkboxes.forEach(cb => {
                                    cb.required = !isChecked;
                                });
                            }

                            checkboxes.forEach(cb => {
                                cb.addEventListener('change', validateCheckboxes);
                            });

                            validateCheckboxes();
                        </script>
                    </div>
                </div>
                <div class="w-full">
                <label class="font-medium text-gray-500">DROIT À L'IMAGE *</label>
                <fieldset>
                    <label class="mr-3"><input class="mr-1 checked:accent-[#FF8B62]" type="radio" name="droit_a_limage" value="oui" checked>Oui</label>
                    <label><input class="mr-1 checked:accent-[#FF8B62]" type="radio" name="droit_a_limage" value="non">Non</label>
                </fieldset>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">AUTORISATION PARENTALE</label>
                    <div class="flex items-start gap-1 ml-3 mt-1">
                        <input class="checked:accent-[#FF8B62] mt-1" type="checkbox" name="autorisation_parentale" value="oui">
                        <label>J'autorise mon fils/ma fille à pratiquer les activités subaquatiques proposées par l'association.</label>
                    </div>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">PERSONNE AUTORISÉE À VENIR RÉCUPÉRER L'ENFANT</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="personne_autorisee_a_venir_recuperer_lenfant" placeholder="Jacques Cousteau">
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">NOM, PRÉNOM, NUMÉRO DE TÉLÉPHONE DE LA PERSONNE À CONTACTER EN CAS D'INCIDENT *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="personne_a_contacter_en_cas_dincident" placeholder="Jacques Cousteau 06 01 23 45 67" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">SON ADRESSE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="adresse_de_la_personne_a_contacter_en_cas_dincident" placeholder="12 Rue Lauzet Ainé, 83110 Sanary-sur-Mer" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">SON NUMÉRO DE TÉLÉPHONE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="tel" name="numero_de_telephone_de_la_personne_a_contacter_en_cas_dincident" placeholder="06 12 34 56 78" required>
                </div>
                <div class="w-full flex justify-around items-center">
                    <div class="flex items-center">
                        <img class="h-5" src="https://img.icons8.com/?size=100&id=7811&format=png&color=000000">
                        <a href="adhesion.html">Retour</a>
                    </div>
                    <button class="flex justify-center items-center bg-[#003262] text-white py-2 px-2 rounded-md text-center" type="submit">CONFIRMER<img class="h-5" src="https://img.icons8.com/?size=100&id=7789&format=png&color=ffffff"></button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
