<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Formulaire d'adhésion | Migennes Subaquatique</title>
<meta name="description" content="Remplissez le formulaire d'adhésion à Migennes Subaquatique." />
<link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=cSBMHDeqDYbh&format=png&color=22C3E6" type="image/x-icon">
<script src="import-header-footer.js" defer></script>
<script src="image-fallback.js" defer></script>
<script src="menu-burger.js" defer></script>
<script src="top-page-button.js" defer></script>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="header.css">
<link rel="stylesheet" href="adhesion-form.css">
<link rel="stylesheet" href="top-page-button.css">
<link rel="stylesheet" href="footer.css">
</head>
<body class="adhesion-form-page" id="top-page">
    <header class="header" id="header"></header>

    <!-- Main -->
    <main class="site-main membership-form-main">
        <!-- Titre principal -->
        <div class="page-heading">
            <div class="title">
                <span>Rejoignez le club Migennes Subaquatique</span>
                <h1>Adhésion</h1>
            </div>
        </div>

        <!-- Formulaire Adhésion -->
        <div>
            <form class="membership-form" name="adhesion" netlify>
                <p class="form-heading">Vos informations</p>
                <div class="form-row">
                    <div class="form-field">
                        <label class="form-label" for="prenom">PRÉNOM *</label>
                        <input class="form-control" id="prenom" type="text" name="prenom" autocomplete="given-name" placeholder="Jacques" required>
                    </div>
                    <div class="form-field">
                        <label class="form-label" for="nom">NOM *</label>
                        <input class="form-control" id="nom" type="text" name="nom" autocomplete="family-name" placeholder="Cousteau" required>
                    </div>
                </div>
                <div class="form-field">
                    <label class="form-label" for="date-de-naissance">DATE DE NAISSANCE *</label>
                    <input class="form-control" id="date-de-naissance" type="date" name="date_de_naissance" autocomplete="bday" min="1940-01-01" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="email">EMAIL *</label>
                    <input class="form-control" id="email" type="email" name="email" autocomplete="email" placeholder="jacques@ocean.fr" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="adresse">ADRESSE *</label>
                    <input class="form-control" id="adresse" type="text" name="adresse" autocomplete="street-address" placeholder="12 Rue Lauzet Ainé, 83110 Sanary-sur-Mer" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="numero-de-telephone">NUMÉRO DE TÉLÉPHONE *</label>
                    <input class="form-control" id="numero-de-telephone" type="tel" name="numero_de_telephone" autocomplete="tel" placeholder="06 12 34 56 78" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="numero-de-licence">NUM DE LICENCE *</label>
                    <input class="form-control" id="numero-de-licence" type="text" name="numero_de_license" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="assurance">Assurance *</label>
                    <select class="form-control" id="assurance" name="assurance" required>
                        <option value="loisir1">Loisir 1 : 25€</option>
                        <option value="loisir2">Loisir 2 : 30€</option>
                        <option value="loisir3">Loisir 3 : 51€</option>
                    </select>
                </div>
                <div class="form-field">
                    <label class="form-label" for="niveau-actuel">NIVEAU ACTUEL *</label>
                    <select class="form-control" id="niveau-actuel" name="niveau_actuel" required>
                        <option value="debutant">Débutant</option>
                        <option value="bronze">Bronze</option>
                        <option value="argent">Argent</option>
                        <option value="or">Or</option>
                        <option value="niveau_1">Niveau 1</option>
                        <option value="niveau_2">Niveau 2</option>
                        <option value="niveau_3">Niveau 3</option>
                        <option value="pa40">PA40</option>
                        <option value="inititateur">Inititateur</option>
                        <option value="guide_de_palanquee">Guide de palanquée</option>
                        <option value="mf1">MF1</option>
                        <option value="mf2">MF2</option>
                    </select>
                </div>
                <div class="form-field activity-field">
                    <div class="activity-options">
                        <fieldset id="activites-group">
                            <legend class="form-label">ACTIVITÉS ET FORMATIONS *</legend>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-plongee-enfant" type="checkbox" name="activites_et_formations" value="plongee_enfant">
                                <label for="activite-plongee-enfant">Plongée enfant (&lt;12ans)</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-plongee-jeune" type="checkbox" name="activites_et_formations" value="plongee_jeune">
                                <label for="activite-plongee-jeune">Plongée jeune (12-16 ans)</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-plongee-sous-marine" type="checkbox" name="activites_et_formations" value="plongee_sous_marine">
                                <label for="activite-plongee-sous-marine">Plongée sous-marine</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-nage-avec-palmes" type="checkbox" name="activites_et_formations" value="nage_avec_palmes">
                                <label for="activite-nage-avec-palmes">Nage avec palmes</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-apnee" type="checkbox" name="activites_et_formations" value="apnee">
                                <label for="activite-apnee">Apnée</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-ecole-niveau-1" type="checkbox" name="activites_et_formations" value="ecole_niveau_1">
                                <label for="activite-ecole-niveau-1">École Niveau 1</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-ecole-niveau-2" type="checkbox" name="activites_et_formations" value="ecole_niveau_2">
                                <label for="activite-ecole-niveau-2">École Niveau 2</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-ecole-niveau-3" type="checkbox" name="activites_et_formations" value="ecole_niveau_3">
                                <label for="activite-ecole-niveau-3">École Niveau 3</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-rifap" type="checkbox" name="activites_et_formations" value="rifap">
                                <label for="activite-rifap">RIFAP</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-initiateur" type="checkbox" name="activites_et_formations" value="initiateur">
                                <label for="activite-initiateur">Initiateur</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-nitrox-base" type="checkbox" name="activites_et_formations" value="nitrox_base">
                                <label for="activite-nitrox-base">Nitrox base</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-nitrox-confirme" type="checkbox" name="activites_et_formations" value="nitrox_confirme">
                                <label for="activite-nitrox-confirme">Nitrox confirmé</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-tiv" type="checkbox" name="activites_et_formations" value="tiv">
                                <label for="activite-tiv">TIV</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-vetement-etanche" type="checkbox" name="activites_et_formations" value="vetement_etanche">
                                <label for="activite-vetement-etanche">Vêtement étanche</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-formation-anteor" type="checkbox" name="activites_et_formations" value="formation_anteor">
                                <label for="activite-formation-anteor">Formation ANTEOR</label>
                            </div>
                            <div class="activity-option">
                                <input class="form-choice" id="activite-recyclage-anteor" type="checkbox" name="activites_et_formations" value="recyclage_anteor">
                                <label for="activite-recyclage-anteor">Recyclage ANTEOR</label>
                            </div>
                        </fieldset>
                        <script>
                            const checkboxes = document.querySelectorAll(
                                'input[name="activites_et_formations"]'
                            );

                            function validateCheckboxes() {
                                const isChecked = [...checkboxes].some(cb => cb.checked);

                                checkboxes.forEach(cb => {
                                    cb.required = !isChecked;
                                });
                            }

                            checkboxes.forEach(cb => {
                                cb.addEventListener('change', validateCheckboxes);
                            });

                            validateCheckboxes();
                        </script>
                    </div>
                </div>
                <div class="form-field">
                <fieldset>
                    <legend class="form-label">DROIT À L'IMAGE *</legend>
                    <label class="consent-option"><input class="form-choice" id="droit-image-oui" type="radio" name="droit_a_limage" value="oui" checked>Oui</label>
                    <label><input class="form-choice" id="droit-image-non" type="radio" name="droit_a_limage" value="non">Non</label>
                </fieldset>
                </div>
                <div class="form-field parental-consent">
                    <p class="form-label">AUTORISATION PARENTALE</p>
                    <div class="consent-field">
                        <input class="form-choice" id="autorisation-parentale" type="checkbox" name="autorisation_parentale" value="oui">
                        <label for="autorisation-parentale">J'autorise mon fils/ma fille à pratiquer les activités subaquatiques proposées par l'association.</label>
                    </div>
                </div>
                <div class="form-field">
                    <label class="form-label" for="personne-autorisee">PERSONNE AUTORISÉE À VENIR RÉCUPÉRER L'ENFANT</label>
                    <input class="form-control" id="personne-autorisee" type="text" name="personne_autorisee_a_venir_recuperer_lenfant" placeholder="Jacques Cousteau">
                </div>
                <div class="form-field">
                    <label class="form-label" for="contact-incident">NOM, PRÉNOM, NUMÉRO DE TÉLÉPHONE DE LA PERSONNE À CONTACTER EN CAS D'INCIDENT *</label>
                    <input class="form-control" id="contact-incident" type="text" name="personne_a_contacter_en_cas_dincident" placeholder="Jacques Cousteau 06 01 23 45 67" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="adresse-contact-incident">SON ADRESSE *</label>
                    <input class="form-control" id="adresse-contact-incident" type="text" name="adresse_de_la_personne_a_contacter_en_cas_dincident" placeholder="12 Rue Lauzet Ainé, 83110 Sanary-sur-Mer" required>
                </div>
                <div class="form-field">
                    <label class="form-label" for="telephone-contact-incident">SON NUMÉRO DE TÉLÉPHONE *</label>
                    <input class="form-control" id="telephone-contact-incident" type="tel" name="numero_de_telephone_de_la_personne_a_contacter_en_cas_dincident" placeholder="06 12 34 56 78" required>
                </div>
                <div class="form-actions">
                    <div class="back-link">
                        <img class="form-action-icon" src="https://img.icons8.com/?size=100&amp;id=7811&amp;format=png&amp;color=000000" width="100" height="100" loading="lazy" decoding="async" alt="">
                        <a href="adhesion.html">Retour</a>
                    </div>
                    <button class="submit-button" type="submit">CONFIRMER<img class="form-action-icon" src="https://img.icons8.com/?size=100&amp;id=7789&amp;format=png&amp;color=ffffff" width="100" height="100" loading="lazy" decoding="async" alt=""></button>
                </div>
            </form>
        </div>
    </main>
    <div class="top-page-button" id="top-page-button"></div>
    <footer id="footer"></footer>
</body>
</html>
