<!doctype html>
<html class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migennes Subaquatique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<style>
    body {
        font-family: 'Poppins', sans-serif;
    }
</style>
</head>
<body class="flex flex-col w-full" id="topPage">
    <!-- Header -->
    <div id="header"></div>
    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
            document.getElementById("header").innerHTML = data;

            const burger = document.getElementById('burger');
            const menu = document.getElementById('menu');
            if (burger && menu) {
                burger.addEventListener('click', () => {
                menu.classList.toggle('hidden');
                });
            }

            // Détection page active
            const links = document.querySelectorAll("nav a");
            const currentPath = window.location.pathname;
            links.forEach(link => {
                if (link.getAttribute("href") === currentPath) {
                link.classList.add("underline", "text-[#FF8B62]");

                link.setAttribute("href", "#topPage");
                }
            });
            });
    </script>

    <!-- Main -->
    <main class="w-full flex flex-col gap-10 px-8 pt-[150px] pb-5 md:pt-[155px] bg-[#f3f3f3]">
        <!-- Titre principal -->
        <div class="bg-[#003262] p-4 rounded shadow-lg text-white text-center text-[min(4vw,3rem)] font-bold">
            <h1>Agenda du club</h1>
        </div>
        
        <div>
            <iframe src="https://calendar.google.com/calendar/embed?height=600&wkst=2&ctz=Europe%2FParis&showPrint=0&mode=MONTH&showTz=0&showCalendars=0&showTabs=0&src=bWlnZW5uZXMuc3ViYXF1YXRpcXVlQGdtYWlsLmNvbQ&color=%239e69af" style="border-width:0" width="100%" height="400" frameborder="0" scrolling="no"></iframe>
        </div>

        <!-- Retour haut de page -->
        <div id="topPageButton"></div>
        <script>
            document.addEventListener("DOMContentLoaded", function () {
                fetch("top-page-button.html")
                    .then(response => response.text())
                    .then(data => {
                        const container = document.getElementById("topPageButton");
                        container.innerHTML = data;

                        const button = container.querySelector("div");

                        window.addEventListener("scroll", function () {
                            if (window.scrollY > 200) {
                                button.classList.remove("opacity-0", "pointer-events-none");
                                button.classList.add("opacity-85");
                            } else {
                                button.classList.remove("opacity-85");
                                button.classList.add("opacity-0", "pointer-events-none");
                            }
                        });
                    });
            });
        </script>
    </main>

    <!-- Footer -->
    <div id="footer"></div>
    <script>
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
            document.getElementById("footer").innerHTML = data;
            });
    </script>
</body>
</html>
