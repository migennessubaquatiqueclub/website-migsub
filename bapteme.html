    <body class="bapteme-page" data-current-page="bapteme" id="top-page">
        <a class="skip-link" href="#main-content">Aller au contenu principal</a>
        <!-- Header -->
        <header class="header" id="header"></header>

        <!-- Main -->
        <main class="bapteme-main" id="main-content" tabindex="-1">
            <section class="bapteme-hero">
                <picture class="bapteme-hero-image" aria-hidden="true">
                    <source type="image/avif" srcset="/.netlify/images?url=/images/bapteme.jpg&amp;fm=avif&amp;w=320 320w, /.netlify/images?url=/images/bapteme.jpg&amp;fm=avif&amp;w=640 640w, /.netlify/images?url=/images/bapteme.jpg&amp;fm=avif&amp;w=960 960w, /.netlify/images?url=/images/bapteme.jpg&amp;fm=avif&amp;w=1280 1280w, /.netlify/images?url=/images/bapteme.jpg&amp;fm=avif&amp;w=1600 1600w" sizes="(min-width: 1232px) 1200px, (min-width: 601px) calc(100vw - 48px), calc(100vw - 24px)">
                    <img src="/images/bapteme.jpg" srcset="/.netlify/images?url=/images/bapteme.jpg&amp;w=320 320w, /.netlify/images?url=/images/bapteme.jpg&amp;w=640 640w, /.netlify/images?url=/images/bapteme.jpg&amp;w=960 960w, /.netlify/images?url=/images/bapteme.jpg&amp;w=1280 1280w, /.netlify/images?url=/images/bapteme.jpg&amp;w=1600 1600w" sizes="(min-width: 1232px) 1200px, (min-width: 601px) calc(100vw - 48px), calc(100vw - 24px)" width="1440" height="1080" alt="" fetchpriority="high" decoding="async">
                </picture>
                <div class="page-heading">
                    <div class="title">
                        <span>Réserver un</span>
                        <h1>BAPTÊME DE PLONGÉE</h1>
                    </div>
                </div>
            </section>

            <section class="bapteme">
                <form name="bapteme" netlify>
                    <div class="form-field">
                        <label for="prenom">Prénom *</label>
                        <input id="prenom" type="text" name="prenom" autocomplete="given-name" placeholder="Votre prénom" required>
                    </div>
                    <div class="form-field">
                        <label for="nom">Nom *</label>
                        <input id="nom" type="text" name="nom" autocomplete="family-name" placeholder="Votre nom" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Adresse e-mail *</label>
                        <input id="email" type="email" name="email" autocomplete="email" placeholder="email@exemple.com" required>
                    </div>
                    <div class="form-field">
                        <label for="message">Votre message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Posez-nous vos questions"></textarea>
                    </div>
                    <button type="submit">Envoyer la demande</button>
                </form>
            </section>
        </main>

        <!-- Retour haut de page -->
        <div class="top-page-button" id="top-page-button"></div>

        <!-- Footer -->
        <div id="footer"></div>
