<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Migennes Subaquatique</title>
        <meta name="description" content="Réservez votre baptême de plongée à Migennes Subaquatique : une expérience accessible, sécurisée et encadrée par des moniteurs professionnels." />
        <link rel="shortcut icon" href="https://img.icons8.com/?size=100&id=cSBMHDeqDYbh&format=png&color=22C3E6" type="image/x-icon">
        <script src="import-header-footer.js" defer></script>
        <script src="image-fallback.js" defer></script>
        <script src="menu-burger.js" defer></script>
        <script src="top-page-button.js" defer></script>
        <link rel="stylesheet" href="site.css">
        <noscript><link rel="stylesheet" href="site.css"></noscript>
        <link rel="stylesheet" href="header.css">
        <noscript><link rel="stylesheet" href="header.css"></noscript>
        <link rel="stylesheet" href="bapteme.css">
        <noscript><link rel="stylesheet" href="bapteme.css"></noscript>
        <link rel="stylesheet" href="top-page-button.css">
        <noscript><link rel="stylesheet" href="top-page-button.css"></noscript>
        <link rel="stylesheet" href="footer.css">
        <noscript><link rel="stylesheet" href="footer.css"></noscript>
    </head>
    <body id="top-page">
        <!-- Header -->
        <header class="header" id="header"></header>

        <!-- Main -->
        <main>
            <div class="page-heading">
                <div class="title">
                    <span>Réserver un</span>
                    <h1>BAPTÊME DE PLONGÉE</h1>
                </div>
            </div>

            <section class="bapteme">
                <form name="bapteme" netlify>
                    <div class="form-field">
                        <label for="prenom">Prénom *</label>
                        <input id="prenom" type="text" name="prenom" autocomplete="given-name" placeholder="Votre prénom" required>
                    </div>
                    <div class="form-field">
                        <label for="nom">Nom *</label>
                        <input id="nom" type="text" name="nom" autocomplete="family-name" placeholder="Votre nom" required>
                    </div>
                    <div class="form-field">
                        <label for="email">Adresse e-mail *</label>
                        <input id="email" type="email" name="email" autocomplete="email" placeholder="email@exemple.com" required>
                    </div>
                    <div class="form-field">
                        <label for="message">Votre message</label>
                        <textarea id="message" name="message" rows="5" placeholder="Posez-nous vos questions"></textarea>
                    </div>
                    <button type="submit">Envoyer la demande</button>
                </form>
            </section>
        </main>

        <!-- Retour haut de page -->
        <div class="top-page-button" id="top-page-button"></div>

        <!-- Footer -->
        <footer id="footer"></footer>
    </body>
</html>
