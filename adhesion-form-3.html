<!doctype html>
<html class="scroll-smooth">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Migennes Subaquatique</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<script src="multi-step-form.js" defer></script>
<style>
    body {
        font-family: 'Poppins', sans-serif;
    }
</style>
</head>
<body class="flex flex-col w-full bg-[#d9e4e8]" id="topPage">
    <!-- Main -->
    <main class="w-full flex flex-col gap-10 px-8 pb-5 md:pt-[100px]">
        <!-- Titre principal -->
        <div class="flex flex-col items-center">
            <img class="w-18" src="/images/logos/plongeur-bas.png">
            <p class="text-5xl font-bold text-[#003262]">Adhésion</p>
            <p class="text-gray-500 text-center font-semibold">Rejoignez le club Migennes Subaquatique pour la saison en cours.</p>
        </div>

        <!-- Formulaire Adhésion 3/3 -->
        <div>
            <form class="flex flex-col items-center gap-5 shadow-xl rounded-xl px-4 py-4 bg-[#f6f6f6]" name="adhesion" netlify action="adhesion.html">
                <div class="w-full flex justify-around items-center text-center">
                    <p class="flex justify-center items-center bg-gray-200 text-gray-500 text-xl font-semibold rounded-full w-10 h-10">1</p>
                    <p class="flex justify-center items-center bg-gray-200 text-gray-500 text-xl font-semibold rounded-full w-10 h-10">2</p>
                    <p class="flex justify-center items-center bg-[#FF8B62] text-white text-xl font-semibold rounded-full w-10 h-10">3</p>
                </div>
                <div class="flex items-center gap-2">
                    <img class="w-6 h-5" src="/images/logos/user.png">
                    <p class="font-medium text-2xl">Vos informations</p>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">DROIT À L'IMAGE *</label>
                    <fieldset>
                        <label class="mr-3"><input class="mr-1 checked:accent-[#FF8B62]" type="radio" name="droit à l'image" value="oui" checked>Oui</label>
                        <label><input class="mr-1 checked:accent-[#FF8B62]" type="radio" name="droit à l'image" value="non">Non</label>
                    </fieldset>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">AUTORISATION PARENTALE</label>
                    <div class="flex items-start gap-1 ml-3 mt-1">
                        <input class="checked:accent-[#FF8B62] mt-1" type="checkbox" name="autorisation_parentale" value="oui">
                        <label>J'autorise mon fils/ma fille à pratiquer les activités subaquatiques proposées par l'association.</label>
                    </div>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">PERSONNE AUTORISÉE À VENIR RÉCUPÉRER L'ENFANT</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="personne autorisée à venir récupérer l'enfant" placeholder="Jacques Cousteau">
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">NOM, PRÉNOM, NUMÉRO DE TÉLÉPHONE DE LA PERSONNE À CONTACTER EN CAS D'INCIDENT *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="personne à contacter en cas d'incident" placeholder="Jacques Cousteau 06 01 23 45 67" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">SON ADRESSE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="text" name="adresse de la personne à contacter en cas d'incident" placeholder="12 Rue Lauzet Ainé, 83110 Sanary-sur-Mer" required>
                </div>
                <div class="w-full">
                    <label class="font-medium text-gray-500">SON NUMÉRO DE TÉLÉPHONE *</label>
                    <input class="placeholder:text-gray-700 w-full bg-gray-200 rounded-lg px-4 py-2 border border-gray-400" type="tel" name="numéro de téléphone de la personne à contacter en cas d'incident" placeholder="06 12 34 56 78" required>
                </div>
                <div class="w-full flex justify-around items-center">
                    <div class="flex items-center">
                        <img class="h-5" src="https://img.icons8.com/?size=100&id=7811&format=png&color=000000">
                        <a href="adhesion-form-2.html">Retour</a>
                    </div>
                    <!-- <button class="bg-[#003262] text-white py-2 w-32 rounded-md" type="submit">CONFIRMER</button> -->
                    <button type="submit" class="flex justify-center items-center bg-[#003262] text-white py-2 px-2 rounded-md text-center">
                        CONFIRMER
                        <img class="h-5" src="https://img.icons8.com/?size=100&id=7789&format=png&color=ffffff">
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
